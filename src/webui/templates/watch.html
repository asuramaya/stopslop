{% extends "base.html" %}
{% block title %} - Watch{% endblock %}
{% block content %}
<div class="watch-page">
  <h2>Watch</h2>
  <form id="watch-filters" onsubmit="return false">
    <input type="text" id="watch-path" name="path" placeholder="Filter by path, e.g. docs/ or README">
    <select id="watch-ruleset" name="ruleset">
      {% for id in ruleset_ids %}
      <option value="{{ id }}">{{ id }}</option>
      {% endfor %}
    </select>
  </form>
  <div id="watch-activity" class="watch-activity"
       hx-get="/watch/fragment"
       hx-trigger="load, every 2s [document.visibilityState=='visible'], keyup changed delay:300ms from:#watch-path, change from:#watch-ruleset"
       hx-include="#watch-path,#watch-ruleset"
       hx-swap="innerHTML">
  </div>
</div>
{% endblock %}
