<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stopslop{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">&#128721; stopslop</span>
    <nav>
      {% for id, label, icon in nav %}
      <a href="/{{ id }}" class="{{ 'active' if id == active else '' }}">{{ icon }} {{ label }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% include "fragments/notices.html" %}
    {% block content %}{% endblock %}
  </main>
  <hr>
  <footer id="status-footer" hx-get="/status/fragment" hx-trigger="load, every 10s" hx-swap="innerHTML">
    {% include "fragments/status_footer.html" %}
  </footer>
</body>
</html>
